name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build

  image:
    name: Docker image + e2e
    runs-on: ubuntu-latest
    # The image only makes sense if both halves pass.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t crossstitchhelper:ci .
      - name: Start the instance and wait for it to respond
        run: |
          docker run -d --name csh -p 8000:8000 crossstitchhelper:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          # An "ok" status proves the database was created and migrated at
          # startup, not just that the process is alive.
          grep -q '"status":"ok"' /tmp/health.json
          # The built frontend must be served by the same process.
          curl -fsS http://127.0.0.1:8000/ | grep -qi "<div id=\"root\">"
      - name: Seed the demo pattern
        # The e2e tests (Lot 1) need at least one pattern in the database to
        # verify progress persistence.
        run: docker exec csh python scripts/seed_demo_pattern.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install e2e dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: e2e tests (against the real Docker image)
        working-directory: frontend
        run: npm run test:e2e
      - name: e2e report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Clean up the container
        if: always()
        run: docker rm -f csh
