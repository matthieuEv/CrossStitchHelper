name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Formatage et règles
        run: ruff check .
      - name: Typage
        run: mypy
      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typage
        run: npm run typecheck
      - name: Construction
        run: npm run build

  image:
    name: Image Docker
    runs-on: ubuntu-latest
    # L'image n'a de sens que si les deux moitiés passent.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image
        run: docker build -t crossstitchhelper:ci .
      - name: Vérifier que l'instance démarre et répond
        run: |
          docker run -d --name csh -p 8000:8000 crossstitchhelper:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          # Un statut « ok » prouve que la base a été créée et migrée au
          # démarrage, pas seulement que le processus est vivant.
          grep -q '"status":"ok"' /tmp/health.json
          # Le frontend construit doit être servi par le même processus.
          curl -fsS http://127.0.0.1:8000/ | grep -qi "<div id=\"root\">"
          docker rm -f csh
