name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker:
    name: Build and publish Docker image
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Docker image

            | | |
            |---|---|
            | Image | `${{ steps.image.outputs.name }}` |
            | Tags | `${{ github.ref_name }}`, `latest` |
            | Platforms | `linux/amd64`, `linux/arm64` (Raspberry Pi, Apple Silicon, ARM servers) |

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ```

            ## New install

            Create a `docker-compose.yml`, then run `docker compose up -d` and open `http://<server-address>:8765`:

            ```yaml
            services:
              crossstitchhelper:
                image: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
                container_name: crossstitchhelper
                restart: unless-stopped
                ports:
                  - "8765:8000"
                volumes:
                  - ./data:/data
            ```

            ## Updating an existing instance

            Back up first (Settings → Data in the app, or a copy of the `./data` directory), then:

            ```bash
            docker compose pull
            docker compose up -d
            ```

            Your data lives in the `./data` volume, never in the image, and database migrations run automatically on startup. `GET /api/health` reports the running version (`${{ github.ref_name }}`).

            Full documentation: [README](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/README.md).

            ---
