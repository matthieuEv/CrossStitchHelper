name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual run from the Actions tab (or `gh workflow run`): builds the head of
  # the selected branch and creates the tag only once the image is published.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v2.0.0-beta.1. A pre-release (with a `-`) only publishes its image: no `latest`, no GitHub Release."
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Validate the version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$VERSION' is not a SemVer tag (expected v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
          prerelease=false
          [[ "$VERSION" == *-* ]] && prerelease=true

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Never overwrite an image testers or users already pulled.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --silent 2>/dev/null; then
              echo "::error::Tag $VERSION already exists"
              exit 1
            fi
            # Only main may publish a final version, which becomes `latest`.
            if [[ "$prerelease" == false && "$GITHUB_REF_NAME" != main ]]; then
              echo "::error::A final version can only be published from main (got $GITHUB_REF_NAME)"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: [version]
    uses: ./.github/workflows/ci.yml

  docker:
    name: Build and publish Docker image
    needs: [version, ci]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [[ "$PRERELEASE" == true ]]; then
            echo "tags=$name:$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$name:$VERSION,$name:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A pre-release only gets its image and its tag, never a GitHub Release.
      # On a manual run the tag is created here, once the image is published,
      # so it always points to the commit that was built.
      - name: Tag the pre-release
        if: env.PRERELEASE == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA" --silent

      - name: Summary
        if: env.PRERELEASE == 'true'
        run: |
          {
            echo "## Pre-release \`$VERSION\`"
            echo
            echo "Built from \`$GITHUB_REF_NAME\` at \`$GITHUB_SHA\`."
            echo
            echo '```bash'
            echo "docker pull ${{ steps.image.outputs.name }}:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: env.PRERELEASE != 'true'
        uses: softprops/action-gh-release@v3
        with:
          # On a manual run (only allowed from main for a final version) the
          # tag does not exist yet: it is created here, on the commit built.
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            CrossStitchHelper ${{ env.VERSION }} is available.

            ```bash
            docker pull ${{ steps.image.outputs.name }}:${{ env.VERSION }}
            ```
