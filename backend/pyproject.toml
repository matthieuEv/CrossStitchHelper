[project]
name = "crossstitchhelper-backend"
version = "0.1.0"
description = "API et moteur d'extraction de CrossStitchHelper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
    "pillow>=11.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
# Alembic génère des modules de migration non typés : les exclure du strict.
exclude = ["^alembic/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymupdf n'expose aucune information de type (pas de py.typed, pas de stubs
# tiers disponibles) : impossible de rester strict sur ce module précis.
module = ["pymupdf", "pymupdf.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
