<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the application fills the screen to the edges, and
         safe areas are handled in CSS via env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5ead8" />
    <!-- Applies the chosen theme (light/dark/system, `src/lib/theme.tsx`) and
         language (`src/i18n/index.tsx`) before the first render: without this
         blocking script, an explicit choice different from the
         system/browser would show a flash of the wrong theme, or an incorrect
         `<html lang>`, for the instant React takes to start. Logic
         deliberately duplicated from `theme.tsx`/`i18n/index.tsx` — this
         script runs before the application bundle is loaded, hence before
         anything else is available. Colours hard-coded here for the same
         reason, since no CSS variable is loaded yet at this point; keeping
         them in sync with `--color-bg` (`index.css`) is manual but
         deliberate. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("csh.theme");
          var choice = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = choice === "system" ? (systemDark ? "dark" : "light") : choice;
          document.documentElement.dataset.theme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "dark" ? "#1f1d19" : "#f5ead8");
        } catch (e) {
          // localStorage unavailable (private browsing): stay on the default
          // light theme, already hard-coded above.
        }
        try {
          var storedLanguage = localStorage.getItem("csh.language");
          var language =
            storedLanguage === "fr" || storedLanguage === "en"
              ? storedLanguage
              : navigator.language.toLowerCase().indexOf("fr") === 0
                ? "fr"
                : "en";
          document.documentElement.lang = language;
        } catch (e) {
          // localStorage unavailable: stay on "fr", already hard-coded above.
        }
      })();
    </script>
    <!-- Without this tag, iOS shows the Safari bar even once the app has been
         added to the home screen. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CrossStitch" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>CrossStitchHelper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
