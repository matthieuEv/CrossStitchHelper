<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover : l'application occupe l'écran jusqu'aux bords, et
         les zones sûres sont gérées en CSS via env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5ead8" />
    <!-- Applique le thème choisi (clair/sombre/système, `src/lib/theme.tsx`)
         avant le premier rendu : sans ce script bloquant, un choix explicite
         différent du système afficherait un éclair de mauvais thème le temps
         que React démarre. Logique dupliquée depuis `theme.tsx` à dessein —
         ce script tourne avant que le bundle applicatif ne soit chargé, donc
         avant que quoi que ce soit d'autre ne soit disponible. Couleurs en
         dur ici pour la même raison qu'aucune variable CSS n'est encore
         chargée à ce stade ; les garder synchronisées avec `--color-bg`
         (`index.css`) est manuel mais volontaire. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("csh.theme");
          var choice = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = choice === "system" ? (systemDark ? "dark" : "light") : choice;
          document.documentElement.dataset.theme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", resolved === "dark" ? "#1f1d19" : "#f5ead8");
        } catch (e) {
          // localStorage indisponible (navigation privée) : reste sur le clair
          // par défaut, déjà posé en dur ci-dessus.
        }
      })();
    </script>
    <!-- Sans cette balise, iOS affiche la barre Safari même une fois l'app
         ajoutée à l'écran d'accueil. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CrossStitch" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <title>CrossStitchHelper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
